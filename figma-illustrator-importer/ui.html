<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 8px;
  }
  p.hint {
    color: #666;
    line-height: 1.5;
    margin: 0 0 14px;
  }
  #dropzone {
    border: 1.5px dashed #b3b3b3;
    border-radius: 6px;
    padding: 22px 12px;
    text-align: center;
    cursor: pointer;
    color: #666;
    transition: border-color 0.15s, background 0.15s;
  }
  #dropzone.drag {
    border-color: #18a0fb;
    background: #f0f8ff;
    color: #18a0fb;
  }
  #dropzone strong { color: #18a0fb; }
  input[type="file"] { display: none; }
  #fileInfo {
    margin-top: 10px;
    font-size: 11px;
    color: #444;
    word-break: break-all;
    min-height: 14px;
  }
  #status {
    margin-top: 10px;
    font-size: 11px;
    color: #444;
    min-height: 32px;
    white-space: pre-line;
  }
  #status.error { color: #d13636; }
  #status.success { color: #1a8a4a; }
  .actions {
    margin-top: 14px;
    display: flex;
    gap: 8px;
  }
  button {
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 5px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  button.primary {
    background: #18a0fb;
    color: white;
  }
  button.primary:disabled {
    background: #b8e0fd;
    cursor: not-allowed;
  }
  button.secondary {
    background: transparent;
    border-color: #ddd;
    color: #333;
  }
</style>
</head>
<body>
  <h1>AI → Figma Importer</h1>
  <p class="hint">
    In Illustrator: <strong>File → Export → Export As → SVG</strong> (Styling:
    "Presentation Attributes", Images: "Embed"), then drop that .svg file below.
  </p>

  <div id="dropzone">
    <div>Drop an <strong>.svg</strong> file here<br/>or click to choose one</div>
    <input type="file" id="fileInput" accept=".svg,image/svg+xml" />
  </div>
  <div id="fileInfo"></div>
  <div id="status"></div>

  <div class="actions">
    <button class="primary" id="importBtn" disabled>Import to Figma</button>
    <button class="secondary" id="cancelBtn">Close</button>
  </div>

  <script src="lib/svg-parser.js"></script>
  <script src="ui.js"></script>
</body>
</html>
