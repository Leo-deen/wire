<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    color: #1a1a1a;
  }
  h1 { font-size: 13px; margin: 0 0 8px; }
  p.hint { color: #666; line-height: 1.5; margin: 0 0 12px; }
  #status {
    padding: 8px 10px;
    border-radius: 5px;
    margin-bottom: 10px;
    background: #f2f2f2;
  }
  #status.ok { background: #e6f7ee; color: #1a8a4a; }
  #status.err { background: #fdeaea; color: #d13636; }
  #log {
    margin-top: 10px;
    font-size: 11px;
    color: #555;
    white-space: pre-line;
    max-height: 160px;
    overflow-y: auto;
  }
  button {
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 5px;
    border: 1px solid #ddd;
    background: transparent;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>AI &rarr; Figma Live Bridge</h1>
  <p class="hint">
    Keep this plugin open, then in Illustrator select something and click
    <strong>Push Selection to Figma</strong> in the AI to Figma Bridge panel.
  </p>
  <div id="status">Connecting to bridge server&hellip;</div>
  <div id="log"></div>
  <button id="closeBtn">Close</button>

  <script src="ui.js"></script>
</body>
</html>
